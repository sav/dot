# ~/.config/i3/status-dark.conf - i3status configuration file. -*- eval: (rainbow-mode); -*-

# It is important that this file is edited as UTF-8.
# The following line should contain a sharp s:
# ß
# If the above line is not correctly displayed, fix your editor first!

general {
        output_format  = i3bar
        colors         = true
        interval       = 16
        colors         = true
        color_good     = "#a3be8c"
        color_degraded = "#ebcb8b"
        color_bad      = "#bf616a"
}

order += "load"
order += "memory"
order += "tztime local"

wireless wlo1 {
        format_up = "  %essid (%quality)    🖧 %ip"
        format_down = "  wlo"
        align = "left"
        separator = false
        separator_block_width = 2
}

ethernet enp3s0 {
        format_up = "🖧 %ip (%speed)"
        format_down = " eth"
}

battery all {
        format = "%status %percentage %remaining %emptytime  |  "
        format_down = "No battery"
        status_chr = "⚡"
        status_bat = "🔋"
        status_unk = "?"
        status_full = "😎"
        path = "/sys/class/power_supply/BAT%d/uevent"
        last_full_capacity = true
        threshold_type=percentage
        low_threshold=10
        align="right"
        separator=false
}

disk "/home" {
        format = "🏠  free: %avail"
}

load {
        format = "💻  %5min  %15min"
        align = "center"
        separator = true
}

cpu_temperature 0 {
        format = "🌡 %degrees °C"
        path = "/sys/devices/platform/coretemp.0/hwmon/hwmon*/temp1_input"
        align = "center"
        max_threshold = 82
}

memory {
        format = "%used | %available"
        threshold_degraded = "1G"
        format_degraded = "MEMORY < %available"
}

tztime local {
       format = "   |    📅 %a %d %b    ⏰ %Hh %Mm      |    "
       separator = false
       align = "center"
       separator_block_width = 2
}

read_file uptime {
        path = "/proc/uptime"
}
